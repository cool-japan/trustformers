[package]
name = "trustformers-serve"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "High-performance inference server for TrustformeRS models"
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/trustformers-serve"
keywords = ["inference", "server", "batching", "llm", "optimization"]
categories = ["web-programming", "science"]
readme = "README.md"

[lints]
workspace = true

[features]
default = []
# Enable Kafka message queue backend (requires cmake, C-based librdkafka)
kafka = ["dep:rdkafka"]
#
# REMOVED 2026-08-24: `lambda = ["dep:lambda-web"]`, together with the
# `lambda-web` dependency itself. The feature was entirely vestigial: nothing in
# this crate ever wrote `#[cfg(feature = "lambda")]` and nothing ever referenced
# `lambda_web` (verify: `grep -rn 'feature = "lambda"' .` and
# `grep -rn lambda_web --include=*.rs src/` both match nothing). `lambda_runtime`,
# the other half of that never-finished adapter, had already been dropped from
# the workspace in an earlier pass. Keeping it cost real security surface:
# `lambda-web` pulls `lambda_runtime` -> `hyper 0.14` -> `h2 0.3.27`
# (RUSTSEC-2026-0258, unbounded empty DATA frames) and the banned
# `brotli`/`brotli-decompressor` crates. AWS Lambda deployment is still supported
# the way it is actually implemented today — through the SageMaker/Lambda control
# -plane SDK clients in `src/serverless/` and `src/cloud_providers/`, which deploy
# and invoke functions over the AWS APIs rather than running this binary inside
# the Lambda runtime. Re-adding an in-process Lambda adapter means writing the
# adapter, not just restoring the manifest line.
# Enable bundled Swagger UI assets via `utoipa-swagger-ui`. Its build-dependency
# pulls the banned `zip` crate; kept out of the default Pure-Rust tree. The `/docs`
# endpoint (CDN-hosted Swagger UI) remains available without this feature.
swagger-ui = ["dep:utoipa-swagger-ui"]

[dependencies]
anyhow.workspace = true
async-graphql.workspace = true
async-graphql-axum.workspace = true
async-trait.workspace = true
axum = { workspace = true, features = ["multipart"] }
bytes.workspace = true
chrono.workspace = true
dashmap.workspace = true
futures.workspace = true
jsonwebtoken.workspace = true
lazy_static.workspace = true
log.workspace = true
num_cpus.workspace = true
once_cell.workspace = true
parking_lot.workspace = true
ordered-float.workspace = true
prometheus.workspace = true
prost.workspace = true
regex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
tonic.workspace = true
# Runtime Prost codec for tonic 0.14: code generated by `tonic-prost-build`
# references `tonic_prost::ProstCodec`, split out of `tonic` in 0.14.
tonic-prost.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
#
# Deliberately NOT declared here: `opentelemetry`, `opentelemetry-otlp`,
# `opentelemetry-jaeger`, `opentelemetry-zipkin`,
# `opentelemetry-semantic-conventions` and `tracing-opentelemetry` (removed
# 2026-08-24). All six were non-optional dependencies with zero references
# anywhere in this crate: it never constructed an OpenTelemetry tracer, exporter
# or pipeline. `opentelemetry-jaeger` was the root of RUSTSEC-2025-0123 (crate
# deprecated upstream); there was no exporter wiring to migrate to
# `opentelemetry-otlp`, so the honest resolution was deletion rather than
# swapping one unused dependency for another. (`grep -rn 'opentelemetry' src/`
# now matches only doc comments in `src/tracing/legacy/export.rs`, which say the
# same thing; before 2026-08-24 it also matched one `"opentelemetry"` *string
# literal* used as a metadata tag.)
#
# This crate's distributed tracing stays a self-contained implementation
# (`src/tracing/`) that models spans itself. Its exporters are real, not a
# renamed internal dump: `src/tracing/legacy/export.rs` emits a Jaeger trace
# document, a Zipkin v2 span array and an OTLP/JSON `ExportTraceServiceRequest`
# with `serde_json` alone, each with conformance tests. Adding an OpenTelemetry
# SDK crate would therefore be a re-implementation, not a capability — do it only
# with the pipeline/exporter code that needs it, and note that
# `opentelemetry-otlp` (not `opentelemetry-jaeger`) is what a Jaeger backend
# accepts natively today.
url.workspace = true
uuid.workspace = true
utoipa = { workspace = true, features = ["axum_extras", "chrono", "uuid"] }
# Optional: gated behind the `swagger-ui` feature. Its build-dependency pulls the
# banned `zip` crate, so it is excluded from the default Pure-Rust dependency tree.
utoipa-swagger-ui = { workspace = true, features = ["axum"], optional = true }
clap.workspace = true
env_logger.workspace = true
tokio-rustls.workspace = true
rustls.workspace = true
base64.workspace = true
mime_guess.workspace = true
fastrand.workspace = true
toml.workspace = true
semver.workspace = true
sha2.workspace = true
hex.workspace = true
# Cryptography (RustCrypto, Pure Rust) for the encryption subsystem: real AEAD
# (AES-GCM / ChaCha20-Poly1305), real block/stream ciphers, real KDFs, OS CSPRNG
# and constant-time comparison. No C/C++ toolchain is involved.
aes-gcm.workspace = true
chacha20poly1305.workspace = true
aes.workspace = true
cbc.workspace = true
salsa20.workspace = true
poly1305.workspace = true
hkdf.workspace = true
hmac.workspace = true
pbkdf2.workspace = true
getrandom.workspace = true
subtle.workspace = true
zeroize.workspace = true
glob.workspace = true
# This crate additionally needs `sysinfo::Disks` / `sysinfo::Networks`, which the
# workspace entry leaves off; member feature lists are additive, so the extra two
# features are requested here while the version stays workspace-wide.
sysinfo = { workspace = true, features = ["disk", "network"] }
libc.workspace = true
oxicode.workspace = true
rmp-serde.workspace = true
oxiarc-deflate.workspace = true
oxiarc-lz4.workspace = true
oxiarc-zstd.workspace = true

# Message Queue Dependencies
# rdkafka is optional and requires the "kafka" feature; cmake-build pulls in C/C++ deps.
# The "zstd" feature is dropped: use oxiarc-zstd at the application layer instead.
rdkafka = { workspace = true, features = ["cmake-build", "ssl", "sasl"], optional = true }
lapin.workspace = true
redis = { workspace = true, features = ["tokio-comp", "streams"] }
async-nats.workspace = true
# AWS SDK clients. Each one is opted out of its own `default` feature set and
# given back exactly `["default-https-client", "rt-tokio"]`. Both the opt-out and
# the feature list live in `[workspace.dependencies]` at the repository root,
# because a member's `default-features = false` is ignored unless the workspace
# entry sets it as well. See the block below for why.
aws-sdk-sqs.workspace = true
aws-config.workspace = true

# Cloud Provider Dependencies
aws-sdk-sagemaker.workspace = true
aws-sdk-sagemakerruntime.workspace = true
aws-sdk-lambda.workspace = true
aws-sdk-cloudwatch.workspace = true
#
# WHY `default-features = false` ON THE AWS SDKs (2026-08-24)
#
# Each `aws-sdk-*` crate ships `default = ["rustls", "default-https-client",
# "rt-tokio"]`, and those first two features select *two different, complete* TLS
# stacks that were both being compiled in:
#
#   "rustls"               -> aws-smithy-runtime/tls-rustls
#                          -> aws-smithy-http-client/legacy-rustls-ring
#                          -> rustls 0.21 + rustls-webpki 0.101.7 + hyper 0.14
#                             + h2 0.3 + hyper-rustls 0.24 + tokio-rustls 0.24
#   "default-https-client" -> aws-smithy-runtime/default-https-client
#                          -> aws-smithy-http-client/rustls-aws-lc
#                          -> rustls 0.23 + hyper 1.x
#
# The legacy stack was the root of four advisories: RUSTSEC-2026-0098,
# RUSTSEC-2026-0099 and RUSTSEC-2026-0104 (rustls-webpki 0.101.7 — URI/wildcard
# name-constraint acceptance and a pre-signature-verification CRL parsing panic)
# and RUSTSEC-2026-0258 (h2 0.3.27 unbounded empty DATA frames). None of them was
# fixable with `cargo update`: `rustls-webpki ^0.101.7` and `h2 ^0.3.24` are hard
# requirements of `rustls 0.21.12` / `aws-smithy-http-client 1.3.0`'s
# `legacy-rustls-ring` feature, so the only way out is to stop enabling the
# feature.
#
# Dropping it changes no runtime behavior, and that is measured rather than
# assumed. `aws_smithy_runtime::client::defaults::default_http_client_plugin_v2`
# picks the legacy hyper-0.14 client only in the `behavior_version <
# v2026_01_12` branch, *or* when `default-https-client` is off; with
# `default-https-client` on and a behavior version at or past v2026_01_12 the
# hyper-1.x client "takes precedence over legacy connector if enabled" (its own
# comment). `aws-smithy-runtime-api 1.14.0`'s `BehaviorVersion::latest()` returns
# `v2026_01_12`, and all three of this crate's entry points call
# `aws_config::load_defaults(aws_config::BehaviorVersion::latest())`
# (`src/message_queue/sqs.rs:35`, `src/cloud_providers/sagemaker.rs:61`,
# `src/serverless/types.rs:571`). The legacy stack was therefore compiled,
# audited, and never used to send a request.
#
# `aws-config` keeps its own defaults on purpose: its `default` is
# `["default-https-client", "rt-tokio", "credentials-process", "sso"]` — it never
# enables `tls-rustls` — and it already declares `aws-sdk-sso`/`ssooidc`/`sts`
# with `default-features = false`, so it contributes none of the legacy stack.
#
# KNOWN REMAINING GAP (not fixable from a manifest): `default-https-client`
# resolves to `aws-smithy-http-client/rustls-aws-lc`, which pulls `aws-lc-rs` ->
# `aws-lc-sys`, a C/C++ (BoringSSL-derived) build — a COOLJAPAN Pure-Rust policy
# violation that predates this change. There is no feature route to the pure-Rust
# `ring` provider: `aws-smithy-http-client` does expose `rustls-ring`, but
# `aws-smithy-runtime` has no feature that forwards to it, and
# `aws_smithy_runtime::client::http::default_https_client` hardcodes
# `tls::rustls_provider::CryptoMode::AwsLc`. Closing it requires a *code* change:
# turn `default-https-client` off here, add a direct
# `aws-smithy-http-client = { default-features = false, features = ["rustls-ring"] }`
# dependency, and build the client explicitly at the three `load_defaults` sites
# above via `Builder::new().tls_provider(tls::Provider::Rustls(CryptoMode::Ring))`,
# passing it to `aws_config::defaults(..).http_client(..)`. Do not turn
# `default-https-client` off without that code change: with no HTTP client
# configured and no default available, every AWS request fails at runtime with
# "a http_client is required".
#
# Deliberately NOT declared here: `lambda-web` (removed 2026-08-24 — see the
# `[features]` table above for why), `lambda_runtime`, `google-cloud-gax`,
# `google-cloud-functions-v2`, `azure_core`, `azure_identity`,
# `azure_mgmt_machinelearningservices` and `azure_mgmt_web`. Each was a
# non-optional dependency with zero references anywhere in `src/` — verify with
# `grep -rn 'lambda_runtime\|google_cloud\|azure_core\|azure_identity\|azure_mgmt' src/`.
# The Azure and Google serverless providers in `src/serverless/` return
# `ServerlessError::NotImplemented` rather than calling any SDK, so nothing was
# lost by removing them. The AWS SDKs below are kept: they have real call sites
# (CloudWatch alone has 29). Dropping `azure_core`/`azure_identity` also removed
# the last unwrapped `flate2` parent from the dependency graph — see the
# compression section of the workspace `deny.toml`.

# Internal dependencies
trustformers-core.workspace = true
trustformers-mobile.workspace = true
# Real model implementations + safetensors/pickle checkpoint loading. Required so the
# serving layer can run genuine forward passes and report measured weight footprints
# instead of placeholders. `gpt2` is the decoder architecture wired into the batch
# executor; `bert` is the worked example for the checkpoint binder.
trustformers-models = { workspace = true, features = ["gpt2", "bert"] }
# Real tokenization for the HTTP/gRPC text path (HuggingFace `tokenizer.json`).
# Without it the serving layer could not turn a prompt into token ids honestly.
trustformers-tokenizers.workspace = true
scirs2-core = { workspace = true }

[dev-dependencies]
axum-test.workspace = true
criterion.workspace = true
tempfile.workspace = true
tokio-test.workspace = true
futures.workspace = true
chrono.workspace = true
proptest.workspace = true
approx.workspace = true
#
# Deliberately NOT declared here: `paste` (removed 2026-08-24). It was a direct
# dev-dependency, which is what made RUSTSEC-2024-0436 (`paste` unmaintained,
# "no safe upgrade available") fire under `deny.toml`'s
# `[advisories] unmaintained = "workspace"` setting. Its single reference in this
# crate is the `paste::paste!` call inside the `optimized_test_with_progress!`
# macro body in `src/test_utilities.rs`, and that macro is **never invoked**
# anywhere in the repository (`grep -rn optimized_test_with_progress --include=*.rs .`
# matches only its own definition), so a `macro_rules!` body that is never
# expanded keeps compiling without the dependency. `paste` is still in the
# dependency *graph* transitively (metal/mpsgraph, pulp, rav1e, simba,
# tokenizers) — dropping the direct dev-dep does not remove it from the tree, it
# stops the workspace from declaring an unmaintained crate first-hand. Follow-up
# for whoever owns `src/test_utilities.rs`: delete the dead macro, or rewrite it
# without token pasting (a maintained fork, `pastey`, exists if the macro is ever
# revived).

[build-dependencies]
tonic-build.workspace = true
tonic-prost-build.workspace = true

[package]
name = "trustformers-serve"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "High-performance inference server for TrustformeRS models"
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/trustformers-serve"
keywords = ["inference", "server", "batching", "llm", "optimization"]
categories = ["web-programming", "science"]
readme = "README.md"

[lints]
workspace = true

[features]
default = []
# Enable Kafka message queue backend (requires cmake, C-based librdkafka)
kafka = ["dep:rdkafka"]
# Enable AWS Lambda adapter. Pulls `lambda-web`, which depends on the banned
# `brotli`/`brotli-decompressor` crates; kept out of the default Pure-Rust tree.
lambda = ["dep:lambda-web"]
# Enable bundled Swagger UI assets via `utoipa-swagger-ui`. Its build-dependency
# pulls the banned `zip` crate; kept out of the default Pure-Rust tree. The `/docs`
# endpoint (CDN-hosted Swagger UI) remains available without this feature.
swagger-ui = ["dep:utoipa-swagger-ui"]

[dependencies]
anyhow.workspace = true
async-graphql = "7.2.1"
async-graphql-axum = "7.2.1"
async-trait.workspace = true
axum = { workspace = true, features = ["multipart"] }
bytes.workspace = true
chrono.workspace = true
dashmap.workspace = true
futures.workspace = true
jsonwebtoken.workspace = true
lazy_static.workspace = true
log.workspace = true
num_cpus.workspace = true
once_cell.workspace = true
opentelemetry = "0.32"
opentelemetry-otlp = "0.32"
opentelemetry-jaeger = "0.22"
opentelemetry-zipkin = "0.32"
opentelemetry-semantic-conventions = "0.32"
parking_lot.workspace = true
ordered-float.workspace = true
prometheus.workspace = true
prost.workspace = true
regex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
tonic.workspace = true
# Runtime Prost codec for tonic 0.14: code generated by `tonic-prost-build`
# references `tonic_prost::ProstCodec`, split out of `tonic` in 0.14.
tonic-prost.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-opentelemetry = "0.33"
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true
utoipa = { version = "5.5", features = ["axum_extras", "chrono", "uuid"] }
# Optional: gated behind the `swagger-ui` feature. Its build-dependency pulls the
# banned `zip` crate, so it is excluded from the default Pure-Rust dependency tree.
utoipa-swagger-ui = { version = "9.0", features = ["axum"], optional = true }
clap.workspace = true
env_logger.workspace = true
tokio-rustls.workspace = true
rustls = "0.23"
base64.workspace = true
mime_guess.workspace = true
fastrand.workspace = true
toml.workspace = true
semver.workspace = true
sha2.workspace = true
hex.workspace = true
glob = "0.3"
sysinfo = "0.39.5"
libc.workspace = true
oxicode.workspace = true
rmp-serde.workspace = true
oxiarc-deflate.workspace = true
oxiarc-lz4.workspace = true
oxiarc-zstd.workspace = true

# Message Queue Dependencies
# rdkafka is optional and requires the "kafka" feature; cmake-build pulls in C/C++ deps.
# The "zstd" feature is dropped: use oxiarc-zstd at the application layer instead.
rdkafka = { version = "0.39", features = ["cmake-build", "ssl", "sasl"], optional = true }
lapin = "4.10"
redis = { version = "1.3", features = ["tokio-comp", "streams"] }
async-nats = "0.49"
aws-sdk-sqs = "1.102"
aws-config = "1.8"

# Cloud Provider Dependencies
aws-sdk-sagemaker = "1.210"
aws-sdk-sagemakerruntime = "1.105"
aws-sdk-lambda = "1.130"
aws-sdk-cloudwatch = "1.118"
# Optional: gated behind the `lambda` feature. Pulls the banned `brotli` crate,
# so it is excluded from the default Pure-Rust dependency tree.
lambda-web = { version = "0.2.1", optional = true }
lambda_runtime = "1.2.1"
google-cloud-gax = "1.11.0"
google-cloud-functions-v2 = "1.12.0"
azure_core = "1.0"
azure_identity = "1.0"
azure_mgmt_machinelearningservices = "0.21"
azure_mgmt_web = "0.21"

# Internal dependencies
trustformers-core.workspace = true
trustformers-mobile.workspace = true
scirs2-core = { workspace = true }

[dev-dependencies]
axum-test.workspace = true
criterion.workspace = true
tempfile.workspace = true
tokio-test.workspace = true
futures.workspace = true
chrono.workspace = true
proptest.workspace = true
approx.workspace = true
paste.workspace = true

[build-dependencies]
tonic-build.workspace = true
tonic-prost-build.workspace = true

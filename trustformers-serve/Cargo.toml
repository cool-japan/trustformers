[package]
name = "trustformers-serve"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "High-performance inference server for TrustformeRS models"
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/trustformers-serve"
keywords = ["inference", "server", "batching", "llm", "optimization"]
categories = ["web-programming", "science"]
readme = "README.md"

[lints]
workspace = true

[features]
default = []
# Enable Kafka message queue backend (requires cmake, C-based librdkafka)
kafka = ["dep:rdkafka"]
# Enable AWS Lambda adapter. Pulls `lambda-web`, which depends on the banned
# `brotli`/`brotli-decompressor` crates; kept out of the default Pure-Rust tree.
lambda = ["dep:lambda-web"]
# Enable bundled Swagger UI assets via `utoipa-swagger-ui`. Its build-dependency
# pulls the banned `zip` crate; kept out of the default Pure-Rust tree. The `/docs`
# endpoint (CDN-hosted Swagger UI) remains available without this feature.
swagger-ui = ["dep:utoipa-swagger-ui"]

[dependencies]
anyhow.workspace = true
async-graphql.workspace = true
async-graphql-axum.workspace = true
async-trait.workspace = true
axum = { workspace = true, features = ["multipart"] }
bytes.workspace = true
chrono.workspace = true
dashmap.workspace = true
futures.workspace = true
jsonwebtoken.workspace = true
lazy_static.workspace = true
log.workspace = true
num_cpus.workspace = true
once_cell.workspace = true
opentelemetry.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry-jaeger.workspace = true
opentelemetry-zipkin.workspace = true
opentelemetry-semantic-conventions.workspace = true
parking_lot.workspace = true
ordered-float.workspace = true
prometheus.workspace = true
prost.workspace = true
regex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
tonic.workspace = true
# Runtime Prost codec for tonic 0.14: code generated by `tonic-prost-build`
# references `tonic_prost::ProstCodec`, split out of `tonic` in 0.14.
tonic-prost.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true
utoipa = { workspace = true, features = ["axum_extras", "chrono", "uuid"] }
# Optional: gated behind the `swagger-ui` feature. Its build-dependency pulls the
# banned `zip` crate, so it is excluded from the default Pure-Rust dependency tree.
utoipa-swagger-ui = { workspace = true, features = ["axum"], optional = true }
clap.workspace = true
env_logger.workspace = true
tokio-rustls.workspace = true
rustls.workspace = true
base64.workspace = true
mime_guess.workspace = true
fastrand.workspace = true
toml.workspace = true
semver.workspace = true
sha2.workspace = true
hex.workspace = true
# Cryptography (RustCrypto, Pure Rust) for the encryption subsystem: real AEAD
# (AES-GCM / ChaCha20-Poly1305), real block/stream ciphers, real KDFs, OS CSPRNG
# and constant-time comparison. No C/C++ toolchain is involved.
aes-gcm.workspace = true
chacha20poly1305.workspace = true
aes.workspace = true
cbc.workspace = true
salsa20.workspace = true
poly1305.workspace = true
hkdf.workspace = true
hmac.workspace = true
pbkdf2.workspace = true
getrandom.workspace = true
subtle.workspace = true
zeroize.workspace = true
glob.workspace = true
# This crate additionally needs `sysinfo::Disks` / `sysinfo::Networks`, which the
# workspace entry leaves off; member feature lists are additive, so the extra two
# features are requested here while the version stays workspace-wide.
sysinfo = { workspace = true, features = ["disk", "network"] }
libc.workspace = true
oxicode.workspace = true
rmp-serde.workspace = true
oxiarc-deflate.workspace = true
oxiarc-lz4.workspace = true
oxiarc-zstd.workspace = true

# Message Queue Dependencies
# rdkafka is optional and requires the "kafka" feature; cmake-build pulls in C/C++ deps.
# The "zstd" feature is dropped: use oxiarc-zstd at the application layer instead.
rdkafka = { workspace = true, features = ["cmake-build", "ssl", "sasl"], optional = true }
lapin.workspace = true
redis = { workspace = true, features = ["tokio-comp", "streams"] }
async-nats.workspace = true
aws-sdk-sqs.workspace = true
aws-config.workspace = true

# Cloud Provider Dependencies
aws-sdk-sagemaker.workspace = true
aws-sdk-sagemakerruntime.workspace = true
aws-sdk-lambda.workspace = true
aws-sdk-cloudwatch.workspace = true
# Optional: gated behind the `lambda` feature. Pulls the banned `brotli` crate,
# so it is excluded from the default Pure-Rust dependency tree.
lambda-web = { workspace = true, optional = true }
#
# Deliberately NOT declared here: `lambda_runtime`, `google-cloud-gax`,
# `google-cloud-functions-v2`, `azure_core`, `azure_identity`,
# `azure_mgmt_machinelearningservices` and `azure_mgmt_web`. Each was a
# non-optional dependency with zero references anywhere in `src/` — verify with
# `grep -rn 'lambda_runtime\|google_cloud\|azure_core\|azure_identity\|azure_mgmt' src/`.
# The Azure and Google serverless providers in `src/serverless/` return
# `ServerlessError::NotImplemented` rather than calling any SDK, so nothing was
# lost by removing them. The AWS SDKs below are kept: they have real call sites
# (CloudWatch alone has 29). Dropping `azure_core`/`azure_identity` also removed
# the last unwrapped `flate2` parent from the dependency graph — see the
# compression section of the workspace `deny.toml`.

# Internal dependencies
trustformers-core.workspace = true
trustformers-mobile.workspace = true
# Real model implementations + safetensors/pickle checkpoint loading. Required so the
# serving layer can run genuine forward passes and report measured weight footprints
# instead of placeholders. `gpt2` is the decoder architecture wired into the batch
# executor; `bert` is the worked example for the checkpoint binder.
trustformers-models = { workspace = true, features = ["gpt2", "bert"] }
# Real tokenization for the HTTP/gRPC text path (HuggingFace `tokenizer.json`).
# Without it the serving layer could not turn a prompt into token ids honestly.
trustformers-tokenizers.workspace = true
scirs2-core = { workspace = true }

[dev-dependencies]
axum-test.workspace = true
criterion.workspace = true
tempfile.workspace = true
tokio-test.workspace = true
futures.workspace = true
chrono.workspace = true
proptest.workspace = true
approx.workspace = true
paste.workspace = true

[build-dependencies]
tonic-build.workspace = true
tonic-prost-build.workspace = true

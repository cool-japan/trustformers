[package]
name = "trustformers-models"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/trustformers-models"
description = "Model implementations for TrustformeRS"
keywords = ["transformers", "bert", "gpt", "llama", "models"]
categories = ["science", "algorithms"]
readme = "README.md"

[lints]
workspace = true

[dependencies]
trustformers-core = { workspace = true }
# Note: ndarray support provided by scirs2-core
scirs2-core = { workspace = true }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
uuid.workspace = true
memmap2.workspace = true
# `serde_yaml_ng`, not `serde_yaml`: the original crate was archived by its author
# in 2024 and receives no further fixes. `serde_yaml_ng` is the maintained hard
# fork of 0.9.34 with an API-identical surface, so the switch is a rename.
serde_yaml_ng.workspace = true
fastrand.workspace = true
chrono.workspace = true
half.workspace = true
safetensors.workspace = true
tokio.workspace = true
num_cpus.workspace = true
# Pure-Rust system telemetry: real process/system memory readings for memory_profiling.
sysinfo.workspace = true
# Structured logging facade: libraries must not write to stdout.
tracing.workspace = true
regex.workspace = true
# Pure-Rust FFT: Hyena's long-convolution operator runs through oxifft's
# FFT-based `convolve` instead of an O(L*K) scalar loop. (rustfft is banned.)
oxifft.workspace = true

[dev-dependencies]
rstest.workspace = true
approx.workspace = true
pretty_assertions.workspace = true
proptest.workspace = true
tokio-test.workspace = true

# The end-to-end export proof builds one model of each of the five families, so
# it needs all five architecture features. Declaring them here makes cargo skip
# the target when they are off; without it the target still builds (its contents
# are `#![cfg]`-gated) and reports "0 tests run", which reads like a pass.
[[test]]
name = "export_round_trip"
required-features = ["gpt2", "bert", "llama", "mistral", "t5"]

[features]
default = ["bert"]
bert = []
roberta = []
# DistilBERT reuses BertEncoder / BertLayerNames from the BERT implementation.
distilbert = ["bert"]
gpt2 = []
gpt_neo = []
gpt_j = []
t5 = []
albert = []
electra = []
deberta = []
vit = []
swin = []
deit = []
llama = []
llama2 = []
llama3 = []
codellama = []
deepseek = []
gpt_neox = ["llama"]  # GPT-NeoX reuses RotaryEmbedding from LLaMA
mistral = ["llama"]  # Mistral reuses LlamaMLP/RMSNorm from LLaMA
clip = []
gemma = []
qwen = []
phi3 = []
gemma2 = []
mamba = []
rwkv = []
s4 = []
stablelm = []
falcon = []
blip2 = []
llava = []
dalle = []
flamingo = []
linformer = []
internlm2 = []
falcon2 = []
deepseek_v2 = []
qwen2_5 = []
opt = []
granite = []
aya = []
jamba = []
jamba2 = []
sd3 = []
llama3_2 = []
mistral_v3 = []
mixtral = ["llama"]
phi2 = []
mamba2 = []
phi4 = []
nemotron = []
whisper = []
yi = []
starcoder2 = []
metal = ["trustformers-core/metal"]
cuda = ["trustformers-core/cuda"]
all = ["bert", "roberta", "distilbert", "gpt2", "gpt_neo", "gpt_j", "t5", "albert", "electra", "deberta", "vit", "swin", "deit", "llama", "llama2", "llama3", "codellama", "deepseek", "gpt_neox", "mistral", "clip", "gemma", "qwen", "phi3", "gemma2", "mamba", "rwkv", "s4", "stablelm", "falcon", "blip2", "llava", "dalle", "flamingo", "linformer", "internlm2", "falcon2", "deepseek_v2", "qwen2_5", "opt", "granite", "aya", "jamba", "jamba2", "sd3", "llama3_2", "mistral_v3", "phi4", "nemotron", "whisper", "yi", "starcoder2", "mixtral", "phi2", "mamba2"]
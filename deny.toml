# TrustformeRS `cargo-deny` configuration
#
# Schema: cargo-deny 0.18/0.19 (the 0.13-era keys `[advisories] vulnerability`,
# `notice`, `[licenses] unlicensed`/`default`/`allow-osi-fsf-free` and
# `[bans] deprecated`/`denied` were removed upstream and make the whole file
# fail to deserialize, which silently disabled every gate below).
#
# Run all gates:      cargo deny check
# Run the ban gate:   cargo deny check bans      <- COOLJAPAN policy gate
#
# The ban list below is the COOLJAPAN Pure-Rust policy: no C/C++/Fortran in the
# default dependency tree, and the oxi* ecosystem crates in place of the classic
# C-backed (or ecosystem-duplicating) crates. Every exception is a `wrappers`
# entry naming the exact parent crate that pulls the banned crate in, together
# with the reason it is currently unavoidable.

# ---------------------------------------------------------------------------
# Dependency graph construction
# ---------------------------------------------------------------------------
[graph]
# Resolve every feature of every workspace member. The policy is about what a
# consumer *can* pull in, not only what `default` happens to enable, so the
# opt-in backends (swagger-ui, lambda, visual, gif, cuda, metal, ...)
# are all part of the graph that the ban list is evaluated against.
all-features = true
# `targets = []` (the default) keeps every platform in the graph, so the
# iOS/Android/Windows-only dependency blocks are audited too.
targets = []
# Dev-dependencies stay in the graph: criterion's `html_reports` -> plotters ->
# image codec stack is exactly the kind of transitive C-adjacent pull we want
# visible.
exclude-dev = false
# NOTE for anyone reading a failure: `all-features = true` + `exclude-dev = false`
# means these gates are evaluated over a graph that is strictly wider than any
# real build (every opt-in backend plus every dev-dependency). A finding here is
# a policy signal about what a consumer *could* pull in, not proof that the
# default `cargo build` contains the crate.

# ---------------------------------------------------------------------------
# RustSec advisory database
# ---------------------------------------------------------------------------
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# "workspace" = flag unmaintained crates that this workspace depends on
# directly; transitive-only unmaintained crates are not actionable here.
unmaintained = "workspace"
yanked = "deny"
ignore = [
    # Add RUSTSEC ids here ONLY with a comment stating why the exposure does not
    # apply and who owns the removal. Never add one to silence a real finding.
    #
    # ---------------------------------------------------------------------
    # RUSTSEC-2023-0071 — "Marvin Attack" timing side-channel in `rsa 0.9.10`.
    # Accepted 2026-08-24. This is a REAL, UNPATCHED vulnerability in a crate
    # that is genuinely in the tree; it is ignored because there is no pure-Rust
    # way to remove it, NOT because the exposure has been ruled out.
    #
    # Chain:  rsa 0.9.10  <-  jsonwebtoken 11.0.0  <-  trustformers-serve
    #
    # Why it cannot be fixed:
    #  * Upstream RustSec says "No safe upgrade is available!"; the RustCrypto
    #    RSA constant-time rewrite (RustCrypto/RSA#626) has not shipped.
    #  * `jsonwebtoken` requires exactly one crypto backend. Checked against the
    #    latest release (11.0.0, published 2026-07-24) rather than assumed: its
    #    feature table is
    #      rust_crypto = ["ed25519-dalek", "hmac", "p256", "p384", "rand", "rsa", "sha2"]
    #      aws_lc_rs   = ["aws-lc-rs"]
    #    `rsa` is not separable from `rust_crypto` — there is no HMAC-only or
    #    HMAC+EdDSA-only feature — and the alternative backend, `aws_lc_rs`,
    #    links AWS-LC (C/C++, BoringSSL-derived) and is banned by the COOLJAPAN
    #    Pure-Rust policy. So the choice is "keep `rsa`" or "keep a C library".
    #
    # Honest scope of the exposure (do NOT read this as "unreachable"):
    # `trustformers-serve` configures HS256 by default
    # (`src/auth/authconfig_traits.rs:22`) and every JWT it issues and verifies
    # today is HMAC-SHA256, which never enters `rsa`. But `AuthConfig.algorithm`
    # (`src/auth/types.rs:365`) is a `pub` field of type `jsonwebtoken::Algorithm`,
    # so an embedder can set RS256/RS384/RS512/PS* and reach the vulnerable code
    # path. Exploiting it additionally requires a network-observable signing or
    # decryption oracle under attacker-chosen input.
    #
    # Owned removal path (the real fix, not a mitigation): drop `jsonwebtoken`
    # and implement HS256/HS384/HS512 directly on the RustCrypto crates
    # `trustformers-serve` already depends on — `hmac`, `sha2`, `base64`,
    # `subtle` (constant-time tag compare) and `serde_json`. That deletes `rsa`
    # from the tree outright and narrows the public API to the algorithms the
    # server actually implements. It is a source change in `src/auth/`.
    { id = "RUSTSEC-2023-0071", reason = "rsa 0.9.10 <- jsonwebtoken 11 <- trustformers-serve; `rust_crypto` does not separate `rsa`, and the only other backend (`aws_lc_rs`) is banned C/C++ FFI. Accepted 2026-08-24; removal = replace jsonwebtoken with a native HMAC-only JWT implementation in src/auth/." },
]

# ---------------------------------------------------------------------------
# Licenses
# ---------------------------------------------------------------------------
[licenses]
# Anything not listed here is denied (that is the cargo-deny 0.18+ default, the
# old explicit `default = "deny"` key no longer exists).
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "Unlicense",
    "Zlib",
    "0BSD",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

# Per-crate exceptions. Each one names a permissive license that is fine for this
# specific dependency but is deliberately NOT added to the global allow list.
[[licenses.exceptions]]
# libfuzzer-sys: "(MIT OR Apache-2.0) AND NCSA" — NCSA is the permissive
# University of Illinois/NCSA license covering the bundled libFuzzer sources.
# Reached only through image -> ravif -> rav1e (opt-in `vision`/`visual`).
crate = "libfuzzer-sys"
allow = ["NCSA"]

[[licenses.exceptions]]
# minicbor: Blue Oak Model License 1.0.0 (OSI-approved permissive). Pulled by the
# AWS SDK's CBOR wire codec (aws-smithy-cbor -> aws-sdk-cloudwatch).
crate = "minicbor"
allow = ["BlueOak-1.0.0"]

# `ring` ships a composite license that the SPDX scanner cannot infer from the
# file alone.
[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

# ---------------------------------------------------------------------------
# Banned crates (COOLJAPAN Pure-Rust / oxi* ecosystem policy)
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

deny = [
    # -- BLAS / LAPACK ------------------------------------------------------
    # Every one of these compiles or links Fortran/C BLAS. `oxiblas` is the
    # pure-Rust replacement and is already the workspace's BLAS provider.
    { crate = "openblas", use-instead = "oxiblas", reason = "FFI bindings to the C/Fortran OpenBLAS library" },
    { crate = "openblas-src", use-instead = "oxiblas", reason = "C/Fortran OpenBLAS build; COOLJAPAN uses the pure-Rust oxiblas stack" },
    { crate = "openblas-build", use-instead = "oxiblas", reason = "build driver for the C/Fortran OpenBLAS sources" },
    { crate = "blas-src", use-instead = "oxiblas", reason = "selects a C/Fortran BLAS backend; oxiblas provides BLAS in pure Rust" },
    { crate = "blas-sys", use-instead = "oxiblas-blas", reason = "raw FFI bindings to a C BLAS" },
    { crate = "lapack-src", use-instead = "oxiblas", reason = "selects a C/Fortran LAPACK backend" },
    { crate = "lapack-sys", use-instead = "oxiblas", reason = "raw FFI bindings to a C/Fortran LAPACK" },
    { crate = "netlib-src", use-instead = "oxiblas", reason = "builds reference Fortran BLAS/LAPACK" },
    { crate = "intel-mkl-src", use-instead = "oxiblas", reason = "downloads and links Intel MKL (closed-source C)" },
    { crate = "accelerate-src", use-instead = "oxiblas", reason = "links Apple's Accelerate framework (C); macOS-only escape hatch is not the default path" },

    # -- Serialization ------------------------------------------------------
    { crate = "bincode", use-instead = "oxicode", reason = "COOLJAPAN ecosystem replacement (oxicode) is the mandated binary codec" },

    # -- FFT ----------------------------------------------------------------
    { crate = "rustfft", use-instead = "oxifft", reason = "COOLJAPAN ecosystem replacement (oxifft)" },

    # -- SQLite -------------------------------------------------------------
    { crate = "rusqlite", use-instead = "oxisql-sqlite-compat", reason = "wraps libsqlite3 (C); oxisql-sqlite-compat is the pure-Rust SQLite-format backend" },
    { crate = "libsqlite3-sys", use-instead = "oxisql-sqlite-compat", reason = "vendors/links the SQLite C amalgamation" },

    # -- SMT solver ---------------------------------------------------------
    { crate = "z3", use-instead = "oxiz", reason = "links the Z3 C++ solver; oxiz is the pure-Rust replacement" },
    { crate = "z3-sys", use-instead = "oxiz", reason = "raw FFI bindings to the Z3 C++ solver" },

    # -- Compression / archives (oxiarc-* family) ---------------------------
    # `flate2` is never used first-hand; it is only reachable through third-party
    # crates we do not control. Each wrapper below is a parent that is currently
    # unavoidable, with the reason it cannot be dropped. Any OTHER parent is a
    # real policy violation and is intentionally left unwrapped so this gate
    # reports it; today there is none — see the status note under the list.
    { crate = "flate2", use-instead = "oxiarc-deflate", wrappers = [
        "png",   # image-rs PNG decoder (image -> png), opt-in `vision`/`visual`
        "tiff",  # image-rs TIFF decoder (image -> tiff), opt-in `vision`/`visual`
        "zip",   # utoipa-swagger-ui build script (opt-in `swagger-ui` feature)
        # The AWS SDK compresses request bodies itself. trustformers-serve has a
        # real, used CloudWatch metrics integration (29 call sites in
        # src/), so this edge cannot be removed without dropping that feature.
        "aws-sdk-cloudwatch",
        "aws-smithy-compression",
    ], reason = "C-free but ecosystem-duplicating DEFLATE; COOLJAPAN uses oxiarc-deflate" },
    { crate = "miniz_oxide", use-instead = "oxiarc-deflate", wrappers = [
        "flate2", # flate2's own pure-Rust backend
        "png",    # image-rs PNG decoder
        "exr",    # image-rs OpenEXR decoder (image -> exr)
    ], reason = "DEFLATE implementation behind flate2; COOLJAPAN uses oxiarc-deflate" },
    { crate = "zip", use-instead = "oxiarc-archive", wrappers = [
        "utoipa-swagger-ui", # build-dependency that unpacks the bundled Swagger UI
                             # assets; reachable only via the opt-in `swagger-ui`
                             # feature of trustformers-serve.
    ], reason = "COOLJAPAN uses oxiarc-archive for ZIP containers" },
    { crate = "zstd", use-instead = "oxiarc-zstd", reason = "wraps the zstd C library" },
    { crate = "zstd-sys", use-instead = "oxiarc-zstd", reason = "builds/links the zstd C library" },
    { crate = "zstd-safe", use-instead = "oxiarc-zstd", reason = "safe wrapper over zstd-sys (C)" },
    { crate = "bzip2", use-instead = "oxiarc-archive", reason = "wraps libbz2 (C)" },
    { crate = "bzip2-sys", use-instead = "oxiarc-archive", reason = "builds/links libbz2 (C)" },
    { crate = "lz4", use-instead = "oxiarc-lz4", reason = "wraps the lz4 C library" },
    { crate = "lz4-sys", use-instead = "oxiarc-lz4", reason = "builds/links the lz4 C library" },
    { crate = "lz4_flex", use-instead = "oxiarc-lz4", reason = "ecosystem-duplicating LZ4; COOLJAPAN uses oxiarc-lz4" },
    { crate = "tar", use-instead = "oxiarc-archive", reason = "COOLJAPAN uses oxiarc-archive for TAR containers" },
    { crate = "snap", use-instead = "oxiarc-archive", reason = "ecosystem-duplicating Snappy; COOLJAPAN uses the oxiarc-* family" },
    # No `wrappers` any more: as of 2026-08-24 neither `brotli` nor
    # `brotli-decompressor` is in the graph at all. Their only parent was
    # `lambda-web`, an optional dependency behind `trustformers-serve`'s `lambda`
    # feature; both the feature and the dependency were deleted because nothing in
    # that crate ever referenced `lambda_web` or `#[cfg(feature = "lambda")]`.
    # These entries are kept unwrapped so the gate reports the next parent that
    # appears, instead of silently permitting one. The workspace's own Brotli is
    # `oxiarc-brotli`, which is not this crate and is not banned.
    { crate = "brotli", use-instead = "oxiarc-archive", reason = "ecosystem-duplicating Brotli; COOLJAPAN uses the oxiarc-* family" },
    { crate = "brotli-decompressor", use-instead = "oxiarc-archive", reason = "ecosystem-duplicating Brotli; COOLJAPAN uses the oxiarc-* family" },
]

# STATUS OF THE `flate2` GATE (verified with `cargo deny check bans` -> `bans ok`)
#
# This block used to record a KNOWN OPEN VIOLATION: `flate2` reached the default
# build through `compression-codecs <- async-compression <- tower-http`, a chain
# created by `azure_core`/`azure_identity`'s `reqwest_gzip` / `reqwest_deflate`
# features. Those four Azure crates had zero references in
# `trustformers-serve/src` and have since been dropped, and with them the whole
# chain: `cargo tree -i compression-codecs --all-features` now reports that no
# package matches, and `cargo deny check bans` reports `bans ok`.
#
# Every remaining parent of `flate2` is a wrapper listed above. Re-verify with:
#
#   cargo tree -i flate2 --all-features --depth 1
#
# which today prints exactly `zip` (utoipa-swagger-ui build script),
# `aws-sdk-cloudwatch`, `aws-smithy-compression`, `png` and `tiff`.
#
# If a NEW unwrapped parent ever appears, do not add a wrapper reflexively: a
# wrapper entry is a statement that the edge is unavoidable, so it needs the
# same kind of evidence as the paragraph above.

# KNOWN OPEN PURE-RUST GAP: `aws-lc-sys` (2026-08-24)
#
# `aws-lc-rs 1.18.0` -> `aws-lc-sys 0.44.0` is in the default dependency tree.
# `aws-lc-sys` builds AWS-LC, a BoringSSL-derived C/C++ library — a genuine
# COOLJAPAN Pure-Rust policy violation. It is NOT in the `deny` list above,
# deliberately: adding it would turn `cargo deny check bans` red with no
# in-tree remedy, and this file's rule is that a `deny` entry states a policy
# that can actually be enforced today.
#
# It arrives through `trustformers-serve`'s AWS SDK clients:
#   aws-sdk-*/default-https-client -> aws-smithy-runtime/default-https-client
#                                  -> aws-smithy-http-client/rustls-aws-lc
#                                  -> rustls 0.23 (aws_lc_rs provider)
#
# There is no manifest-only escape, and that was measured, not assumed:
# `aws-smithy-http-client` does expose a pure-Rust `rustls-ring` feature, but
# `aws-smithy-runtime` has no feature that forwards to it, and
# `aws_smithy_runtime::client::http::default_https_client` hardcodes
# `tls::rustls_provider::CryptoMode::AwsLc`. Do not re-attempt a feature-flag
# fix. Closing it requires a source change in `trustformers-serve`: drop
# `default-https-client`, add a direct
# `aws-smithy-http-client = { default-features = false, features = ["rustls-ring"] }`
# dependency, and build the connector explicitly at the three
# `aws_config::load_defaults` sites (`src/message_queue/sqs.rs`,
# `src/cloud_providers/sagemaker.rs`, `src/serverless/types.rs`), passing it via
# `aws_config::defaults(..).http_client(..)`. Removing `default-https-client`
# without that code change makes every AWS request fail at runtime with
# "a http_client is required".
#
# Note `ring 0.17.14` is already in the tree (via rustls 0.23's other consumers:
# async-nats, rustls-webpki, tokio-websockets), so the ring provider costs no new
# dependency — only the wiring above.

# Crates allowed to appear at multiple versions (the `multiple-versions` lint is
# only a warning today; add entries here with a justification when a duplicate
# is genuinely unavoidable).
skip = []
skip-tree = []

# ---------------------------------------------------------------------------
# Sources
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []

[package]
name = "trustformers"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/trustformers"
description = "TrustformeRS - Rust port of Hugging Face Transformers"
keywords = ["transformers", "machine-learning", "nlp", "ai", "bert"]
categories = ["science", "algorithms"]
readme = "README.md"

[lints]
workspace = true

[dependencies]
trustformers-core.workspace = true
trustformers-tokenizers.workspace = true
trustformers-models.workspace = true
trustformers-optim.workspace = true
trustformers-training.workspace = true

serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
anyhow.workspace = true
thiserror.workspace = true
async-trait.workspace = true
futures.workspace = true
tokio.workspace = true
# COOLJAPAN Pure-Rust Policy (Campaign B): reqwest pulls rustls -> aws-lc-rs ->
# aws-lc-sys (C/C++ via cmake/cc). Keep it OUT of the default tree by making it
# optional; only the Hugging Face Hub download paths need it (feature = "hub").
reqwest = { workspace = true, optional = true }
bytes.workspace = true
indicatif.workspace = true
image = { workspace = true, optional = true }
sha2.workspace = true
hex.workspace = true
dirs.workspace = true
tracing.workspace = true
log.workspace = true
regex.workspace = true
chrono.workspace = true
uuid.workspace = true
axum = { workspace = true, optional = true }
num_cpus.workspace = true
oxiarc-deflate.workspace = true
oxiarc-archive.workspace = true
tokio-stream.workspace = true
url.workspace = true
tower = { workspace = true, optional = true }
tower-http = { workspace = true, features = ["fs"], optional = true }
async-stream = { version = "0.3", optional = true }
lazy_static.workspace = true
clap.workspace = true
colored.workspace = true
fastrand.workspace = true

[dev-dependencies]
rstest.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile.workspace = true
proptest.workspace = true
scirs2-core.workspace = true
trustformers-core = { path = "../trustformers-core" }
trustformers-training = { path = "../trustformers-training" }

[features]
default = ["bert", "async"]
bert = ["trustformers-models/bert"]
roberta = ["trustformers-models/roberta"]
albert = ["trustformers-models/albert"]
gpt2 = ["trustformers-models/gpt2"]
gpt_neo = ["trustformers-models/gpt_neo"]
gpt_j = ["trustformers-models/gpt_j"]
t5 = ["trustformers-models/t5"]
all-models = ["bert", "roberta", "albert", "gpt2", "gpt_neo", "gpt_j", "t5"]
candle = ["trustformers-core/candle", "trustformers-training/candle"]
cuda = ["trustformers-models/cuda"]
async = ["axum", "tower", "tower-http", "async-stream"]
vision = ["image"]
audio = []
# Hugging Face Hub networking (model downloads + local mirror). Opt-in because
# reqwest -> rustls -> aws-lc-sys is C/C++. With `hub` off, local/cached model
# loading still works; remote downloads return a clean "enable `hub`" error.
hub = ["dep:reqwest"]
# Full feature set for testing
full = ["all-models", "candle", "async", "vision", "hub", "trustformers-core/full"]

# `custom_backend_examples` builds a RemoteBackend on top of `reqwest`, so it
# only compiles with the `hub` feature enabled.
[[example]]
name = "custom_backend_examples"
required-features = ["hub"]
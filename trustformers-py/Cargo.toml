[package]
name = "trustformers-py"
version = "0.2.2"
edition = "2021"
rust-version = "1.89"
authors = ["COOLJAPAN OU (Team KitaSan) <contact@cooljapan.tech>"]
license = "Apache-2.0"
repository = "https://github.com/cool-japan/trustformers"
homepage = "https://github.com/cool-japan/trustformers"
documentation = "https://docs.rs/trustformers-py"
description = "Python bindings for TrustformeRS transformer library"
categories = ["api-bindings", "science"]
keywords = ["transformers", "python", "machine-learning", "nlp", "pyo3"]
readme = "README.md"

# Standalone crate (not part of main workspace for v0.1.0)
[workspace]

[lib]
name = "trustformers"
crate-type = ["cdylib", "rlib"]

# This crate is excluded from the main workspace (see `[workspace]` above), so it
# cannot use `[lints] workspace = true`; these duplicate the main workspace's
# `[workspace.lints]` table (trustformers/Cargo.toml at the repo root) by hand.
[lints.rust]
unused_variables = "warn"
unused_imports = "warn"
dead_code = "warn"
unused_mut = "warn"
unused_assignments = "warn"
deprecated = "warn"

[lints.clippy]
all = "warn"

[dependencies]
# Python bindings — pinned to 0.28 to match scirs2-core 0.5.0 (which pins pyo3 = "0.28.3").
# Upgrading to pyo3 0.29 is blocked until scirs2-core publishes with pyo3 0.29 support.
# See the "Dependency pins (PyO3 0.28 / SciRS2 0.5.1)" entry in TODO.md, which carries
# the full rationale, the RUSTSEC-2026-0176 / RUSTSEC-2026-0177 context, and the
# migration checklist.
#
# `extension-module` itself is NOT listed here -- it is gated behind this crate's own
# `extension-module` feature (see [features] below) instead of being an unconditional
# pyo3 feature. When it is active (the default, matching every real `pip install`/
# `maturin build`), pyo3-ffi does not link this crate against libpython at all: the
# symbols are resolved dynamically when the compiled `cdylib` is `dlopen`'d by a running
# Python interpreter, which is correct for a real extension module but means a plain
# `cargo test`/`cargo build --bin` (not loaded by Python) fails to link with dozens of
# undefined Python C-API symbols (`_PyExc_BaseException`, `_Py_IncRef`, ...) -- the
# lib-test harness binary is a normal executable, not a `cdylib` Python can inject
# symbols into. Building with `--no-default-features --features python-gc` (or any
# feature set that omits `extension-module`) restores pyo3's normal behavior of linking
# directly against the discovered libpython, which is what `cargo test`/`cargo run`
# need. See TODO.md's "Testing without a Python interpreter loading this module" entry.
pyo3 = { version = "0.28", features = ["abi3-py39"] }
# Pinned to 0.5.1 for the same pyo3-0.29-conflict reason as scirs2-core below.
scirs2-numpy = { version = "0.5.1" }

# Error handling
anyhow = "1.0.100"
thiserror = "2.0.18"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
parking_lot = "0.12.5"
lazy_static = "1.5"
approx = "0.5"
libc = "0.2"
# Structured logging (replaces ad-hoc println!/eprintln! in library code, which a
# Python extension module cannot let the host application route or filter).
tracing = "0.1.44"
# Real `model.safetensors` export for `save_pretrained`. Version matches the pin
# used workspace-wide (trustformers-core / trustformers-models depend on it too).
safetensors = "0.8"

# SciRS2 Integration Policy: Use scirs2-core abstractions instead of direct dependencies
#
# Pinned to 0.5.1 (not the nominal "latest crates" 0.6.5): scirs2-numpy 0.6.5 hard-requires
# pyo3 = "0.29.0" (verified against its published Cargo.toml), which conflicts with this
# crate's own `pyo3 = "0.28"` pin (both declare `links = "python"`, so only one may be in the
# dependency graph). 0.5.1 is the version this workspace's own Cargo.lock already resolved
# against pyo3 0.28.3. Bumping to 0.6.5 requires a pyo3 0.28 -> 0.29 migration across this
# crate's PyO3 surface, and is tracked with a migration checklist in TODO.md under
# "Dependency pins (PyO3 0.28 / SciRS2 0.5.1)".
scirs2-core = { version = "0.5.1", default-features = false, features = ["python", "random", "parallel", "array", "serialization"] }

# TrustformeRS dependencies (path-based for standalone build). Each also
# carries a `version` alongside its `path`: without one, `cargo deny check
# bans` fails with `error[wildcard]` ("crates.io disallows path dependencies"
# for a wildcard/path-only dependency of a publishable crate) -- see TODO.md's
# "Dependency pins" section. The version must track the workspace's own
# `[workspace.package] version` (currently 0.2.2) since these are the same
# repository's sibling crates, resolved locally via `path` in this standalone
# build and would need to resolve from crates.io by `version` alone if this
# crate were ever published without them being co-published first.
trustformers-core = { path = "../trustformers-core", version = "0.2.2", default-features = false }
trustformers-models = { path = "../trustformers-models", version = "0.2.2", default-features = false, features = ["bert", "gpt2", "t5", "llama", "mamba", "rwkv"] }
trustformers-tokenizers = { path = "../trustformers-tokenizers", version = "0.2.2", default-features = false }
trustformers-optim = { path = "../trustformers-optim", version = "0.2.2", default-features = false }
trustformers-training = { path = "../trustformers-training", version = "0.2.2", default-features = false }
# NOTE: the `trustformers` umbrella crate is deliberately NOT listed here. The
# bindings never referenced it (the only mentions left in `src/` are three
# commented-out `use` lines), and `cargo tree -e features -p trustformers-core`
# / `-p trustformers-models` snapshots taken before and after its removal have
# byte-identical normalised feature sets, so nothing depended on it for feature
# unification either. Removing it dropped 54 transitive packages and added none.
# Do not re-add it to "get" a feature: enable that feature explicitly on the
# direct dependency above instead.

[build-dependencies]
pyo3-build-config = { version = "0.28", features = ["resolve-config"] }

[dev-dependencies]
# `half` only appears in unit tests, to build an `F16` tensor -- the one dtype
# `Tensor::to_vec_f32` rejects -- so the conversion-failure paths in
# `models/inputs.rs` can be exercised for real instead of assumed. Pure Rust,
# already in this crate's lock graph via trustformers-core.
half = "2.7.1"


[features]
default = ["python-gc", "extension-module"]
python-gc = []  # Enable Python garbage collection integration
cuda = []  # CUDA support
metal = []  # Metal support
# Build as a real Python extension module (no libpython link; symbols resolve
# via dlopen when Python loads the compiled `cdylib`). On by default, matching
# every real build (`pip install`, `maturin build`) -- disable it (e.g.
# `cargo test --lib --no-default-features --features python-gc`) to link this
# crate's own test/bin targets directly against libpython instead, which a
# `cdylib`-only extension-module build cannot do. See the `pyo3` dependency's
# comment above and TODO.md for the full rationale.
extension-module = ["pyo3/extension-module"]

# All features
full = ["python-gc", "extension-module", "cuda", "metal"]

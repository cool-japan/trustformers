[workspace]
members = [
    "trustformers-core",
    "trustformers-tokenizers",
    "trustformers-models",
    "trustformers-optim",
    "trustformers-training",
    "trustformers",
    "trustformers-wasm",
    "trustformers-mobile",
    "trustformers-debug",
    "trustformers-serve",
]
# Packages that live inside the repository tree but are intentionally not built as
# workspace members. `trustformers-serve/clients/rust` is a standalone generated
# client that is neither a member nor buildable in place; listing it here makes the
# exclusion explicit instead of implicit.
# (`trustformers-js` needs no entry: it contains no Cargo.toml at all, so cargo
# never considers it a package.)
exclude = [
    "examples/server",
    "examples/grpc-server",
    "trustformers-py",
    "trustformers-c",
    "trustformers-serve/clients/rust",
]
resolver = "2"

[workspace.package]
version = "0.2.1"
edition = "2021"
rust-version = "1.89"
authors = ["COOLJAPAN OU (Team KitaSan) <contact@cooljapan.tech>"]
license = "Apache-2.0"
repository = "https://github.com/cool-japan/trustformers"
homepage = "https://github.com/cool-japan/trustformers"

[workspace.dependencies]
# Internal crate dependencies
trustformers = { version = "0.2.1", path = "trustformers", default-features = false }
trustformers-core = { version = "0.2.1", path = "trustformers-core", default-features = false }
trustformers-tokenizers = { version = "0.2.1", path = "trustformers-tokenizers", default-features = false }
trustformers-models = { version = "0.2.1", path = "trustformers-models", default-features = false, features = ["mamba2"] }
trustformers-optim = { version = "0.2.1", path = "trustformers-optim", default-features = false }
trustformers-training = { version = "0.2.1", path = "trustformers-training", default-features = false }
trustformers-wasm = { version = "0.2.1", path = "trustformers-wasm", default-features = false }
trustformers-mobile = { version = "0.2.1", path = "trustformers-mobile", default-features = false }
trustformers-debug = { version = "0.2.1", path = "trustformers-debug", default-features = false }
trustformers-serve = { version = "0.2.1", path = "trustformers-serve", default-features = false }

# Core dependencies
anyhow = "1.0.103"
thiserror = "2.0.18"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
semver = { version = "1.0.28", features = ["serde"] }
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
log = "0.4.33"
lazy_static = "1.5.0"
reqwest = { version = "0.13.4", features = ["json", "stream", "blocking", "form", "query"] }
futures = "0.3.32"
bytes = "1.12.0"
indicatif = "0.18.6"
sha2 = "0.11.0"
hex = "0.4.3"
dirs = "6.0.0"

# Cryptography (RustCrypto) — Pure Rust, no C/C++/Fortran in the default tree.
# Used by trustformers-serve's encryption subsystem for real AEAD, real KDFs and
# constant-time tag comparison. `getrandom` is the OS CSPRNG (syscall bindings only).
aes-gcm = { version = "0.11.0", features = ["aes"] }
chacha20poly1305 = "0.11.0"
aes = "0.9.2"
cbc = { version = "0.2.1", features = ["alloc", "block-padding"] }
salsa20 = "0.11.0"
poly1305 = "0.9.1"
hkdf = "0.13.0"
hmac = "0.13.0"
pbkdf2 = { version = "0.13.0", default-features = false, features = ["hmac"] }
getrandom = "0.4.3"
subtle = "2.6.1"
zeroize = { version = "1.9.0", features = ["derive"] }
# Post-quantum cryptography (RustCrypto, pure Rust, no C/C++/Fortran).
# ML-KEM = FIPS 203 (formerly CRYSTALS-Kyber), ML-DSA = FIPS 204 (formerly
# CRYSTALS-Dilithium), SLH-DSA = FIPS 205 (formerly SPHINCS+).
ml-kem = { version = "0.3.2", features = ["getrandom"] }
ml-dsa = "0.1.1"
slh-dsa = "0.2.0-rc.5"
# RNG trait crate required for RustCrypto interop (traits only, no generator).
rand_core = "0.10.1"
# Arbitrary-precision integers for the Paillier cryptosystem and the
# Schnorr/Fiat-Shamir sigma protocol (pure Rust).
num-bigint = { version = "0.5.1", features = ["rand_core_0_10"] }
num-integer = "0.1.47"
# Pure-Rust cross-platform system telemetry (CPU utilization, temperature sensors,
# memory) for hardware/ device metrics. No C/C++ toolchain required.
# One version for the whole workspace: trustformers-serve used to pin 0.39 locally
# for `sysinfo::Disks` / `sysinfo::Networks`, which put two majors of sysinfo in
# every build. It now takes this entry and adds the `disk`/`network` features on
# top, so the duplicate is gone.
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "component"] }

# ML/Math dependencies
# Note: Per SciRS2 Integration Policy, scientific computing deps are accessed via scirs2-core
# ndarray, rand, rand_distr, rayon, num-complex removed - all crates now use scirs2-core
nalgebra = "0.35.0"
num-traits = "0.2.19"
ordered-float = "5.3.0"
half = { version = "2.7.1", features = ["serde"] }
parking_lot = "0.12.5"
memmap2 = "0.9.11"

# Tokenizer dependencies
# COOLJAPAN Pure-Rust Policy: default features must be C/C++/Fortran-free.
# Drop the upstream default `onig` (C, Oniguruma -> onig_sys) and `esaxx_fast`
# (C++, esaxx-rs/cpp) features. Enable the pure-Rust `fancy-regex` backend
# (drop-in `SysRegex` replacement for onig) and keep the pure-Rust `progressbar`
# (indicatif) capability that was part of the upstream default set.
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex", "progressbar"] }
unicode-normalization = "0.1"
regex = "1.12.4"
# Pure-Rust backtracking regex engine (already in the tree via `tokenizers`'
# `fancy-regex` feature). Needed for the exact GPT-2 / tiktoken pre-tokenizer
# patterns, which use lookahead and are therefore not expressible in `regex`.
fancy-regex = "0.17"
regex-automata = { version = "0.4.18", default-features = false, features = ["std", "syntax", "unicode", "dfa-build", "dfa-search"] }
# Pure-Rust Jinja2-compatible engine for rendering HuggingFace `chat_template`
# strings (Llama/Mistral/Qwen/ChatML tokenizer_config.json templates).
minijinja = "2.24.0"

# Optional dependencies for different backends
candle-core = "0.11.0"
safetensors = "0.8"

# Web/Server dependencies  
axum = { version = "0.8.9", features = ["ws", "macros"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = { version = "10.4", features = ["rust_crypto"] }
num_cpus = "1.17"
once_cell = "1.21"
prometheus = "0.14"
prost = "0.14"
tokio-stream = { version = "0.1", features = ["sync"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace"] }
uuid = { version = "1.23.4", features = ["v4", "serde"] }
tonic-build = "0.14.6"
tonic-prost-build = "0.14.6"

# WebAssembly dependencies (shared by trustformers-debug, trustformers-mobile, trustformers-wasm)
wasm-bindgen = { version = "0.2.126", features = ["serde-serialize"] }
wasm-bindgen-futures = "0.4.76"
js-sys = "0.3.103"
web-sys = { version = "0.3.103", features = [
    "console",
    "Navigator",
    "Performance",
    "PerformanceTiming",
    "Window",
    "Worker",
    "WorkerGlobalScope",
    "WorkerOptions",
    "WorkerType",
    "MessageEvent",
    "MessagePort",
    "MessageChannel",
    "DedicatedWorkerGlobalScope",
    "BroadcastChannel",
    "ServiceWorker",
    "ServiceWorkerContainer",
    "ServiceWorkerRegistration",
    "ServiceWorkerGlobalScope",
    "CacheStorage",
    "Cache",
    "Request",
    "Response",
    "Headers",
    "RequestInit",
    "Event",
    "IdbFactory",
    "IdbDatabase",
    "IdbTransaction",
    "IdbObjectStore",
    "IdbRequest",
    "IdbCursor",
    "IdbKeyRange",
    "IdbVersionChangeEvent",
    "IdbOpenDbRequest",
    "DomException",
    "Document",
    "Element",
    "HtmlElement",
    "CustomElementRegistry",
    "ShadowRoot",
    "ShadowRootMode",
    "DomTokenList",
    "CssStyleDeclaration",
    "CanvasRenderingContext2d",
    "WebGlRenderingContext",
    "WebGl2RenderingContext",
    "HtmlCanvasElement",
    "HtmlSelectElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "OffscreenCanvas",
    "CustomEvent",
    "CustomEventInit",
    "Touch",
    "TouchEvent",
    "TouchList",
    "Blob",
    "File",
    "FileReader",
    "HtmlVideoElement",
    "ImageBitmap",
    "ImageData",
    "MediaDevices",
    "MediaStream",
    "MediaStreamTrack",
    "MediaDeviceInfo",
    "MediaDeviceKind",
    "MediaStreamConstraints",
    "MediaTrackConstraints",
    "MediaTrackSettings",
    "VideoTrack",
    "EventTarget",
    "GpuDevice",
    "GpuBuffer",
    "GpuTexture",
    "GpuCommandEncoder",
    "GpuBindGroup",
    "GpuPipelineLayout",
    "GpuRenderPipeline",
    "GpuComputePipeline",
    "GpuShaderModule",
    "GpuAdapter",
    "GpuQueue",
    "Geolocation",
    "Position",
    "Coordinates",
    "RequestMode",
    "ResponseInit",
    "Screen",
    "ScreenOrientation",
    "Storage",
    "StorageManager",
    "NetworkInformation",
    "MediaQueryList",
    "NodeList",
    "HtmlCollection",
    "Url",
    "BlobPropertyBag",
]}

# Serialization dependencies
rmp-serde = "1.3"

# Python bindings dependencies
# NOTE: `numpy = "0.29"` used to be declared here with no consumer anywhere in the
# workspace (trustformers-py is excluded from the workspace and binds NumPy through
# `scirs2-numpy`). Removed so every entry in this table has a real user.
pyo3 = "0.29"

# Additional core dependencies
oxicode = { version = "0.2.6", features = ["serde"] }
byteorder = "1.5"
dashmap = "6.2"
oxiarc-zstd = { version = "0.4.1" }
oxiarc-deflate = { version = "0.4.1" }
oxiarc-lz4 = { version = "0.4.1" }
oxiarc-archive = { version = "0.4.1" }
# Pure-Rust SQLite-compatible backend (COOLJAPAN OxiSQL ecosystem, C-free fork of Limbo).
# Used for real SQLite-format export in trustformers-debug. NEVER use rusqlite/libsqlite3.
oxisql-sqlite-compat = { version = "0.4.1", features = ["blocking"] }
libc = "0.2.186"
libloading = "0.9"

# BLAS dependencies - OxiBLAS (Pure Rust BLAS/LAPACK from SciRS2 ecosystem)
oxiblas = { version = "0.2.2", features = ["parallel"] }
oxiblas-blas = { version = "0.2.2" }
oxiblas-matrix = { version = "0.2.2" }

# Server and networking dependencies
tokio-util = "0.7"
url = "2.5"
clap = { version = "4.6", features = ["derive"] }
colored = "3.1"
env_logger = "0.11"
tokio-rustls = "0.26"
base64 = "0.22"
# COOLJAPAN FFT (pure Rust, replaces rustfft/FFTW). Used by the media pipelines
# for STFT / mel-spectrogram feature extraction.
oxifft = "0.4.2"
mime_guess = "2.0"
fastrand = "2.4.1"
toml = "1.1.2"

# Dev dependencies
criterion = { version = "0.8.2", features = ["html_reports", "async_tokio"] }
proptest = "1.11"
rstest = "0.26"
approx = "0.5"
pretty_assertions = "1.4"
axum-test = "21.0"
tokio-test = "0.4"
tempfile = "3.27"
paste = "1.0"

# Debug-specific dependencies
indexmap = { version = "2.14", features = ["serde"] }
plotters = { version = "0.3", default-features = false, features = ["bitmap_backend", "bitmap_encoder", "bitmap_gif", "svg_backend", "chrono", "ab_glyph", "image", "deprecated_items", "all_series", "all_elements", "full_palette", "colormaps"] }
crossterm = "0.29"
ratatui = "0.30"
gif = "0.14"
image = "0.25.10"
ffmpeg-next = "8.1"
statrs = "0.18"
md5 = "0.8"

# MPI dependencies for multi-node training (removed from workspace - now optional per crate)
# mpi = "0.8"
# mpi-sys = "0.3"

# Vulkan dependencies for cross-platform GPU computing
vulkano = "0.35.2"
vulkano-shaders = "0.35.0"
bytemuck = { version = "1.25.0", features = ["derive"] }

# WebGPU dependencies for cross-platform GPU computing
wgpu = "30.0"

# SciRS2 dependencies - using crates.io 0.1.x
# Note: "metal" feature removed from default features as it's Apple-specific
# Individual crates should enable it conditionally using target-specific dependencies
scirs2-core = { version = "0.6.5", default-features = false, features = [
    "array",
    "simd",
    "parallel",
    "linalg",
    "memory_efficient",
    "array_protocol",
    "random",  # Required for SciRS2 Integration Policy
    "serialization",  # Required for config and model loading
    # Metal removed - enable via platform-specific dependencies in individual crates
]}

# ---------------------------------------------------------------------------
# COOLJAPAN workspace policy: every dependency version is declared exactly once,
# here. Members reference them with `<crate>.workspace = true` and add only
# `optional = true` / extra `features` on top. The entries below were hoisted out
# of member manifests that used to carry inline version pins; the versions are the
# ones already selected in Cargo.lock, so hoisting them does not change resolution.
# ---------------------------------------------------------------------------

# GPU / accelerator backends (trustformers-core, all optional & feature-gated)
# `mpi` keeps `default-features = false` at the workspace level: its default
# feature set builds `libffi-sys` (C) and fails on macOS ARM64.
mpi = { version = "0.8.2", default-features = false }
pollster = "0.4.0"
opencl3 = "0.12.3"
# Apple GPU stack (macOS/iOS target blocks only)
metal = "0.33.0"
mpsgraph = "0.2.0"
# oxicuda: COOLJAPAN pure-Rust CUDA/Metal compute backends
oxicuda-blas = "0.5.5"
oxicuda-dnn = "0.5.5"
oxicuda-memory = "0.5.5"
oxicuda-driver = "0.5.5"
oxicuda-metal = "0.5.5"
oxicuda-backend = "0.5.5"

# Mobile target-specific dependencies (trustformers-mobile). These are only ever
# compiled for their `cfg(target_os = ...)` block; the versions live here so the
# workspace has a single source of truth.
objc = "0.2.7"
core-foundation = "0.10.1"
core-foundation-sys = "0.8.7"
cocoa = "0.26.1"
jni = "0.22.4"
android_logger = "0.15.1"
console_error_panic_hook = "0.1.7"

# Tokenizer support crates
# `mecab` is a C++ libmecab FFI binding: optional and excluded from every default
# feature set (COOLJAPAN Pure-Rust policy).
mecab = "0.1.6"
crc32fast = "1.5.0"
unicode_categories = "0.1.1"

# Async stream adapters for the umbrella crate's `async` feature
async-stream = "0.3.6"

# Serving layer: GraphQL / OpenAPI / TLS / observability
async-graphql = "7.2.1"
async-graphql-axum = "7.2.1"
utoipa = "5.5.0"
# Pulls the banned `zip` crate through its build script; keep it optional and out
# of every default feature set.
utoipa-swagger-ui = "9.0.2"
rustls = "0.23.43"
glob = "0.3.4"
opentelemetry = "0.32.0"
opentelemetry-otlp = "0.32.0"
opentelemetry-jaeger = "0.22.0"
opentelemetry-zipkin = "0.32.0"
opentelemetry-semantic-conventions = "0.32.1"
tracing-opentelemetry = "0.33.0"

# Serving layer: message queues
# `rdkafka` builds librdkafka (C/C++ via cmake); optional, `kafka` feature only.
rdkafka = "0.39.0"
lapin = "4.10.0"
redis = "1.5.0"
async-nats = "0.49.1"

# Serving layer: cloud provider SDKs
aws-config = "1.10.1"
aws-sdk-sqs = "1.105.0"
aws-sdk-sagemaker = "1.221.0"
aws-sdk-sagemakerruntime = "1.109.0"
aws-sdk-lambda = "1.138.0"
aws-sdk-cloudwatch = "1.123.0"
# `lambda-web` depends on the banned `brotli` crates; optional, `lambda` feature only.
lambda-web = "0.2.1"
lambda_runtime = "1.3.0"
google-cloud-gax = "1.13.0"
google-cloud-functions-v2 = "1.13.0"
azure_core = "1.1.0"
azure_identity = "1.0.0"
azure_mgmt_machinelearningservices = "0.21.0"
azure_mgmt_web = "0.21.0"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[profile.dev]
incremental = true
opt-level = 0
debug = 1                     # Reduced from 2 for faster builds
split-debuginfo = "packed"    # Linux: separate debug info

[profile.dev.package."*"]
debug = 0                     # Disable debug info for dependencies

[profile.dev.build-override]
opt-level = 0
debug = false                 # CUDA build optimization

[profile.test]
opt-level = 2

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1

# WASM-specific optimization profiles
[profile.release-size]
inherits = "release"
opt-level = "z"  # Optimize for size
strip = true     # Strip symbols
panic = "abort"  # Smaller panic handling
codegen-units = 1
lto = true

# Development profile with some optimizations for faster iteration
[profile.dev-opt]
inherits = "dev"
opt-level = 1
debug = 1

# Profile for testing performance optimizations
[profile.perf-test]
inherits = "release"
debug = true     # Keep debug info for profiling
strip = false    # Keep symbols for analysis

[workspace.lints.rust]
unused_variables = "warn"
unused_imports = "warn"
dead_code = "warn"
unused_mut = "warn"
unused_assignments = "warn"
deprecated = "warn"

[workspace.lints.clippy]
all = "warn"

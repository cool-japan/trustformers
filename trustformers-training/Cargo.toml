[package]
name = "trustformers-training"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/trustformers-training"
description = "Training infrastructure for TrustformeRS"
keywords = ["training", "distributed", "machine-learning", "transformers", "optimization"]
categories = ["science", "algorithms"]
readme = "README.md"

[lints]
workspace = true

[dependencies]
trustformers-core.workspace = true
trustformers-optim.workspace = true
# Note: ndarray support provided by scirs2-core
scirs2-core = { workspace = true }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
oxicode.workspace = true
uuid.workspace = true
chrono.workspace = true
fastrand.workspace = true
tokio.workspace = true
sha2.workspace = true
hex.workspace = true
half.workspace = true
rmp-serde.workspace = true
log.workspace = true
regex.workspace = true

[dev-dependencies]
rstest.workspace = true
approx.workspace = true
pretty_assertions.workspace = true
tempfile.workspace = true

[features]
default = []
candle = ["trustformers-core/candle"]
# Full feature set for testing
full = ["candle", "trustformers-core/full"]

[[example]]
name = "simple_classification"
path = "examples/basic_training/simple_classification.rs"
[package]
name = "trustformers-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/trustformers-wasm"
description = "WebAssembly bindings for TrustformeRS transformer library"
categories = ["wasm", "web-programming", "science"]
keywords = ["transformers", "webassembly", "wasm", "machine-learning", "nlp"]
readme = "README.md"

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
serde = { workspace = true, features = ["derive", "alloc"] }
serde_json = { workspace = true, features = ["alloc"] }
serde-wasm-bindgen = { workspace = true }
# `wasm_js` selects the `wasm32-unknown-unknown` backend (Web Crypto via
# `js-sys`); the workspace-level entry carries no backend feature because the
# native crates get theirs from the target OS.
getrandom = { workspace = true, features = ["wasm_js"] }
console_error_panic_hook = { workspace = true, optional = true }
dlmalloc = { workspace = true, features = ["global"], optional = true }
bytemuck = { workspace = true }
# Pure-Rust F16/BF16 <-> F32 conversion for SafeTensors weight loading.
half = { workspace = true }
# Real SHA-256 plugin-bytes integrity checksums (see plugin_framework.rs);
# RustCrypto, pure Rust, COOLJAPAN policy compliant.
sha2 = { workspace = true }
# Pure-Rust DEFLATE (RFC 1951) for real cache/chunk compression (COOLJAPAN
# policy forbids flate2/zstd/lz4/etc. directly; oxiarc-* is the substitute).
oxiarc-deflate = { workspace = true }
# `futures::future::select_all` for real concurrent-chunk streaming loads
# (racing several in-flight `JsFuture`s instead of only ever popping the
# most-recently-started one). Uses the workspace-wide `futures` dependency
# as-is (default features) - not narrowed to `alloc`-only here, since the
# workspace-root `futures` entry does not declare `default-features`, and
# overriding it per-member is rejected by Cargo; changing the shared
# workspace-level default would risk affecting sibling crates.
futures = { workspace = true }

# Core web-sys features for essential functionality (full union defined in workspace root Cargo.toml)
web-sys = { workspace = true }

[dev-dependencies]
wasm-bindgen-test = { workspace = true }

[features]
default = ["console_panic", "dlmalloc-alloc"]
size-optimized = ["dlmalloc-alloc", "console_panic"] # Minimal feature set for size optimization (using dlmalloc instead of unmaintained wee_alloc)
performance-optimized = ["dlmalloc-alloc", "kernel-fusion", "async-executor"] # Performance-first features
console_panic = ["console_error_panic_hook"]
webgpu = []
web-workers = []
shared-memory = []
kernel-fusion = []
async-executor = []
indexeddb = []
memory64 = []
streaming-loader = []
model-splitting = []
react-components = []
vue-components = []
angular-components = []
web-components = []
playground = []
streaming-generation = []
mobile-optimization = []
dlmalloc-alloc = ["dlmalloc"]
minimal = ["dlmalloc-alloc"] # Minimal build with only core features and small allocator (using dlmalloc instead of unmaintained wee_alloc)
full = ["web-workers", "shared-memory", "kernel-fusion", "async-executor", "indexeddb", "memory64", "streaming-loader", "model-splitting", "react-components", "vue-components", "angular-components", "web-components", "playground", "streaming-generation", "mobile-optimization", "dlmalloc-alloc"]

# Tell `rustc` to optimize for small code size.
[package.metadata.wasm-pack]
"wasm-opt" = ["-Oz", "--enable-simd", "--strip-debug", "--strip-producers", "--enable-bulk-memory", "--enable-sign-ext", "--enable-mutable-globals", "--converge"]

# WASM-specific profiles are defined in workspace root Cargo.toml



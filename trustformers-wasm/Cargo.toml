[package]
name = "trustformers-wasm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/trustformers-wasm"
description = "WebAssembly bindings for TrustformeRS transformer library"
categories = ["wasm", "web-programming", "science"]
keywords = ["transformers", "webassembly", "wasm", "machine-learning", "nlp"]
readme = "README.md"

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
serde = { workspace = true, features = ["derive", "alloc"] }
serde_json = { workspace = true, features = ["alloc"] }
serde-wasm-bindgen = "0.6.5"
getrandom = { version = "0.4.3", features = ["wasm_js"] }
console_error_panic_hook = { version = "0.1.7", optional = true }
dlmalloc = { version = "0.2.14", features = ["global"], optional = true }
bytemuck = { workspace = true }

# Core web-sys features for essential functionality (full union defined in workspace root Cargo.toml)
web-sys = { workspace = true }

[dev-dependencies]
wasm-bindgen-test = "0.3.76"

[features]
default = ["console_panic", "dlmalloc-alloc"]
size-optimized = ["dlmalloc-alloc", "console_panic"] # Minimal feature set for size optimization (using dlmalloc instead of unmaintained wee_alloc)
performance-optimized = ["dlmalloc-alloc", "kernel-fusion", "async-executor"] # Performance-first features
console_panic = ["console_error_panic_hook"]
webgpu = []
web-workers = []
shared-memory = []
kernel-fusion = []
async-executor = []
indexeddb = []
memory64 = []
streaming-loader = []
model-splitting = []
react-components = []
vue-components = []
angular-components = []
web-components = []
playground = []
streaming-generation = []
mobile-optimization = []
dlmalloc-alloc = ["dlmalloc"]
minimal = ["dlmalloc-alloc"] # Minimal build with only core features and small allocator (using dlmalloc instead of unmaintained wee_alloc)
full = ["web-workers", "shared-memory", "kernel-fusion", "async-executor", "indexeddb", "memory64", "streaming-loader", "model-splitting", "react-components", "vue-components", "angular-components", "web-components", "playground", "streaming-generation", "mobile-optimization", "dlmalloc-alloc"]

# Tell `rustc` to optimize for small code size.
[package.metadata.wasm-pack]
"wasm-opt" = ["-Oz", "--enable-simd", "--strip-debug", "--strip-producers", "--enable-bulk-memory", "--enable-sign-ext", "--enable-mutable-globals", "--converge"]

# WASM-specific profiles are defined in workspace root Cargo.toml



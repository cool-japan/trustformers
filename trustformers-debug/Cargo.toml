[package]
name = "trustformers-debug"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/trustformers-debug"
description = "Advanced debugging tools for TrustformeRS models"
keywords = ["debugging", "tensor", "gradient", "ml", "diagnostics"]
categories = ["development-tools", "science"]
readme = "README.md"
# Leftover editor/agent artifacts must never ship in the published .crate.
exclude = ["**/*.policy_fix"]

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
oxiarc-archive = { workspace = true }
oxisql-sqlite-compat = { workspace = true }
thiserror.workspace = true
uuid = { workspace = true, features = ["v4", "serde"] }
tokio = { workspace = true, features = ["full"] }
tokio-stream = { workspace = true, features = ["sync"] }
futures.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
parking_lot.workspace = true
indexmap = { workspace = true, features = ["serde"] }
plotters = { workspace = true, optional = true }
crossterm = { workspace = true, optional = true }
ratatui = { workspace = true, optional = true }

# Pure-Rust cross-platform system telemetry (CPU/memory) for the realtime dashboard.
# No C/C++ toolchain required (default-features = false at the workspace level).
sysinfo.workspace = true

# COOLJAPAN Pure-Rust Policy (Campaign B): reqwest pulls rustls -> aws-lc-rs ->
# aws-lc-sys (C/C++ via cmake/cc). Keep it OUT of the default tree by making it
# optional; only the `http-integrations` feature (real CI/CD webhook delivery,
# real MLflow REST tracking) needs it.
reqwest = { workspace = true, optional = true }

# Video generation dependencies
gif = { workspace = true, optional = true }
image = { workspace = true, optional = true }
ffmpeg-next = { workspace = true, optional = true }

# Math and ML dependencies
nalgebra.workspace = true
num-traits.workspace = true
half.workspace = true

# Statistical analysis
statrs.workspace = true

# Time and date handling
chrono = { workspace = true, features = ["serde"] }

# Regular expressions
regex.workspace = true

# Hashing for CI/CD artifacts
md5.workspace = true

# WebAssembly dependencies
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true }

# Internal dependencies
trustformers-core.workspace = true
scirs2-core = { workspace = true }

[dev-dependencies]
tokio-test.workspace = true
criterion.workspace = true
tempfile.workspace = true
# Local-only mock HTTP servers for cicd_integration/mlflow_integration tests
# (bound to 127.0.0.1:0, never touches the network).
axum.workspace = true

[features]
# Default features are Pure-Rust only (COOLJAPAN Pure-Rust policy): no flate2/miniz_oxide.
# `visual` is intentionally NOT in `default` — it pulls plotters -> image -> png ->
# flate2/miniz_oxide (policy-banned compression). Opt in explicitly via `--features visual`.
default = []
# Real HTTP delivery: CI/CD webhook notifications (Slack/Teams/Discord/generic webhook)
# and the MLflow REST API 2.0 tracking client. NOT in `default` — pulls reqwest ->
# rustls -> aws-lc-rs -> aws-lc-sys (C/C++ via cmake/cc). Without this feature the
# HTTP-shaped APIs return a structured "feature disabled" error instead of pretending
# to send.
http-integrations = ["dep:reqwest"]
visual = ["plotters", "ratatui", "crossterm"]  # ratatui (maintained tui fork); pulls flate2 (non-default only)
video = ["gif", "image", "ffmpeg-next"]
gif = ["dep:gif", "image"]
wasm = ["wasm-bindgen", "wasm-bindgen-futures", "js-sys", "web-sys"]
atomics = []  # WebAssembly atomic operations and threading support
headless = []
cuda = []      # NVIDIA CUDA GPU support
rocm = []      # AMD ROCm GPU support
tpu = []       # Google TPU support
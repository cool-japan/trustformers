[package]
name = "trustformers-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/trustformers-core"
description = "Core traits and utilities for TrustformeRS"
keywords = ["transformers", "machine-learning", "nlp", "deep-learning", "rust"]
categories = ["science", "algorithms"]
readme = "README.md"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
tracing.workspace = true
log.workspace = true
# SciRS2 Integration Policy - using scirs2-core for all scientific computing
# Direct ndarray, rand, rand_distr, rayon dependencies removed per SciRS2 Policy
# Use scirs2_core::ndarray, scirs2_core::random, scirs2_core::parallel_ops instead
num-traits.workspace = true  # Still needed for trait bounds
# num-complex removed - use scirs2_core::Complex instead
half.workspace = true
oxicode.workspace = true
safetensors.workspace = true
byteorder.workspace = true
chrono.workspace = true
uuid.workspace = true
regex.workspace = true
regex-automata.workspace = true
lazy_static.workspace = true
dashmap.workspace = true
oxiarc-zstd.workspace = true
parking_lot.workspace = true
once_cell.workspace = true
async-trait.workspace = true
tokio.workspace = true
sha2.workspace = true
hex.workspace = true
sysinfo.workspace = true
# COOLJAPAN Pure-Rust Policy (Campaign B): reqwest pulls rustls -> aws-lc-rs ->
# aws-lc-sys (C/C++ via cmake/cc). Keep it OUT of the default tree by making it
# optional; only the remote leaderboard storage backend needs it.
reqwest = { workspace = true, optional = true }
num_cpus.workspace = true
approx.workspace = true
tempfile.workspace = true
tokenizers.workspace = true  # Re-exported for trustformers-tokenizers per SciRS2 Integration Policy

# SciRS2 dependencies - required for SciRS2 Integration Policy
# Includes: array ops (ndarray), random (rand/rand_distr), parallel (rayon), simd, complex numbers
# Note: ndarray support provided by scirs2-core
# Note: linalg feature is optional to support Python bindings (ndarray-linalg requires ndarray 0.17)
# Note: GPU backends (metal, cuda, opencl, wgpu) should be enabled via scirs2-core for policy compliance
scirs2-core = { workspace = true, features = ["array", "random", "parallel", "simd"] }

# MPI for multi-node communication (optional - only needed for multi-node training)
# `default-features = false` is declared on the workspace entry (it avoids the
# libffi-sys C build that breaks macOS ARM64).
mpi = { workspace = true, optional = true }

# Hardware acceleration backends
vulkano = { workspace = true, optional = true }
vulkano-shaders = { workspace = true, optional = true }
bytemuck = { workspace = true, optional = true }
# Metal-specific dependencies moved to target-specific section for macOS only

# WebGPU backend (cross-platform)
wgpu = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }

# OpenCL backend (universal GPU support)
opencl3 = { workspace = true, optional = true }

# Dynamic loading for optional GPU backends (ROCm)
libloading = { workspace = true, optional = true }

# Campaign C0 spike: oxicuda Pure-Rust CUDA replacement (compile-validation; runtime-loads libcuda)
oxicuda-blas = { workspace = true, optional = true }
oxicuda-dnn = { workspace = true, optional = true }
oxicuda-memory = { workspace = true, optional = true }
oxicuda-driver = { workspace = true, optional = true }

[dev-dependencies]
rstest.workspace = true
approx.workspace = true
pretty_assertions.workspace = true
proptest.workspace = true
tempfile.workspace = true
criterion.workspace = true

[features]
default = ["linalg"]
linalg = ["scirs2-core/linalg"]  # Linear algebra operations
# Remote (HTTP) leaderboard storage backend. Opt-in because it pulls reqwest ->
# rustls -> aws-lc-sys (C/C++). The file/in-memory backends work without it.
remote-leaderboard = ["dep:reqwest"]
# There is no `candle` feature. `Tensor` carried a `Candle(candle_core::Tensor)`
# variant behind one, but nothing in the workspace ever constructed it: every
# site that mentioned it was a match arm returning "Candle tensors not yet
# supported". The feature therefore added a whole tensor backend (and, through
# `candle-core`, the policy-banned `zip` 8.6.0) to `--all-features` builds while
# providing no reachable behaviour, so it was removed.
# Multi-threaded kernels (attention, SDPA, ...) via scirs2-core's rayon-backed
# `parallel_ops`. scirs2-core is already built with this feature above, so the
# flag documents the dependency rather than toggling it.
parallel = ["scirs2-core/parallel"]
mpi = ["dep:mpi"]
cuda = ["dep:oxicuda-blas", "dep:oxicuda-dnn", "dep:oxicuda-memory", "dep:oxicuda-driver"]
rocm = ["dep:libloading"]
intel = []
vulkan = ["dep:vulkano", "dep:vulkano-shaders", "dep:bytemuck"]
# Note: OxiBLAS is now used for all BLAS/LAPACK operations (pure Rust implementation)
metal = ["dep:metal", "dep:mpsgraph", "dep:oxicuda-metal", "dep:oxicuda-backend"]
# Pure-Rust policy escape hatch (macOS): link Apple's Accelerate framework.
# OFF BY DEFAULT and used by no code path in this crate - `oxiblas` provides
# BLAS/LAPACK. Kept only so downstream consumers that vendor Accelerate-dependent
# code can re-enable the link directive from `build.rs` without patching it.
accelerate = []
wgpu_backend = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]
opencl = ["dep:opencl3"]
xla = []
oneapi = []
riscv = []
nccl = []
backtrace = []
# --- Campaign C1: oxicuda Pure-Rust CUDA backend ---
# Deprecated alias: oxicuda is now the `cuda` backend
cuda-oxicuda = ["cuda"]
# Full feature set for testing
full = ["linalg", "parallel", "vulkan", "metal", "wgpu_backend", "opencl", "backtrace"]

[[bench]]
name = "tensor_operations"
harness = false

[[bench]]
name = "hardware_acceleration"
harness = false

[[bin]]
name = "naming_checker"
path = "src/bin/naming_checker.rs"

# Platform-specific dependencies
# Metal is only supported on macOS
[target.'cfg(target_os = "macos")'.dependencies]
scirs2-core = { workspace = true, features = ["array", "random", "parallel", "simd"] }
metal = { workspace = true, optional = true }
mpsgraph = { workspace = true, optional = true }
# OxiBLAS - Pure Rust BLAS/LAPACK implementation (replaces Accelerate framework)
oxiblas = { workspace = true }
oxiblas-blas = { workspace = true }
oxiblas-matrix = { workspace = true }
# Campaign C0 spike: oxicuda Metal backend + compute-backend trait (macOS only)
oxicuda-metal = { workspace = true, optional = true }
oxicuda-backend = { workspace = true, optional = true }

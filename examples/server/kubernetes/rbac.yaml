# Only a ServiceAccount, no Role/RoleBinding: `trustformers-server` never
# calls the Kubernetes API (its configuration comes entirely from environment
# variables injected by kubelet — see kubernetes/configmap.yaml — not from the
# binary reading ConfigMaps or Secrets through the API server itself). The
# previous version of this file granted `get/list/watch` on configmaps and
# `get/list` on secrets to a Role nothing in the application used; a
# permission the workload cannot exercise is not a safety net, just extra
# attack surface, so it is not reinstated here. `deployment.yaml` sets
# `automountServiceAccountToken: false` for the same reason — there is no API
# call this pod's own token would ever be used for.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: trustformers-server
  namespace: trustformers
  labels:
    app: trustformers-server
    app.kubernetes.io/name: trustformers-server
    app.kubernetes.io/instance: trustformers
